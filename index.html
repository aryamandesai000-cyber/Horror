<!DOCTYPE html>
<html>
<head>
<title>Horror Survival Fixed</title>
<style>
body{
margin:0;
background:black;
color:white;
font-family:Arial;
text-align:center;
overflow:hidden;
}

.movie{
padding:15px;
margin:15px auto;
width:60%;
background:#111;
border:2px solid red;
cursor:pointer;
}

#jumpscare{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:none;
z-index:9999;
background:black;
}

#jumpscare img{
width:100%;
height:100%;
object-fit:cover;
}

#fearFill{
height:20px;
width:0%;
background:red;
transition:0.5s;
}

#fearBar{
width:80%;
margin:20px auto;
border:1px solid red;
}
</style>
</head>
<body>

<h1>HORROR SURVIVAL</h1>

<div id="fearBar"><div id="fearFill"></div></div>

<div class="movie" onclick="watchMovie(1)">1</div>
<div class="movie" onclick="watchMovie(2)">2</div>
<div class="movie" onclick="watchMovie(3)">3</div>
<div class="movie" onclick="watchMovie(4)">4</div>
<div class="movie" onclick="watchMovie(5)">5</div>
<div class="movie" onclick="watchMovie(6)">6</div>
<div class="movie" onclick="watchMovie(7)">7</div>
<div class="movie" onclick="watchMovie(8)">8</div>
<div class="movie" onclick="watchMovie(9)">9</div>
<div class="movie" onclick="watchMovie(10)">10</div>

<div id="jumpscare">
<img id="scareImg" src="https://i.imgur.com/8QZ7Z0B.jpg">
</div>

<audio id="scream">
<source src="https://actions.google.com/sounds/v1/human_voices/female_scream.ogg" type="audio/ogg">
</audio>

<script>

let current = 0;
let audioUnlocked = false;

function unlockAudio(){
if(!audioUnlocked){
let sound = document.getElementById("scream");
sound.play().then(()=>{
sound.pause();
sound.currentTime = 0;
audioUnlocked = true;
}).catch(()=>{});
}
}

document.body.addEventListener("click", unlockAudio);

function watchMovie(level){

if(level !== current + 1){
alert("Follow the order...");
return;
}

current++;

triggerJumpScare();

document.getElementById("fearFill").style.width = (current*10) + "%";
}

function triggerJumpScare(){

let scare = document.getElementById("jumpscare");
let sound = document.getElementById("scream");

scare.style.display = "block";

sound.currentTime = 0;
sound.play().catch(()=>{});

if(navigator.vibrate){
navigator.vibrate([300,100,300]);
}

setTimeout(()=>{
scare.style.display = "none";
},1500);
}

</script>

</body>
</html>
