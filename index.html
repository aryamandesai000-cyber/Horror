<!DOCTYPE html>
<html>
<head>
<title>Horror Survival – iOS Fixed</title>
<style>
body{
margin:0;
background:black;
color:white;
font-family:Arial;
text-align:center;
overflow:hidden;
}

h1{
margin-top:30px;
}

.movie{
padding:15px;
margin:15px auto;
width:60%;
background:#111;
border:2px solid red;
cursor:pointer;
transition:0.3s;
}

.movie:hover{
background:red;
}

#fearBar{
width:80%;
height:20px;
border:1px solid red;
margin:20px auto;
}

#fearFill{
height:100%;
width:0%;
background:red;
transition:0.5s;
}

#jumpscare{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:none;
z-index:9999;
}

#jumpscare img{
width:100%;
height:100%;
object-fit:cover;
}
</style>
</head>
<body>

<h1>HORROR SURVIVAL</h1>

<div id="fearBar"><div id="fearFill"></div></div>

<div class="movie" onclick="watchMovie(1)">1</div>
<div class="movie" onclick="watchMovie(2)">2</div>
<div class="movie" onclick="watchMovie(3)">3</div>
<div class="movie" onclick="watchMovie(4)">4</div>
<div class="movie" onclick="watchMovie(5)">5</div>
<div class="movie" onclick="watchMovie(6)">6</div>
<div class="movie" onclick="watchMovie(7)">7</div>
<div class="movie" onclick="watchMovie(8)">8</div>
<div class="movie" onclick="watchMovie(9)">9</div>
<div class="movie" onclick="watchMovie(10)">10</div>

<div id="jumpscare">
<img src="https://i.imgur.com/8QZ7Z0B.jpg">
</div>

<script>

let current = 0;
let audioContext;

// Create audio context only after first user interaction
function initAudio(){
if(!audioContext){
audioContext = new (window.AudioContext || window.webkitAudioContext)();
}
}
document.body.addEventListener("click", initAudio, { once: true });

function playScream(){

if(!audioContext) return;

let duration = 1.2;
let bufferSize = audioContext.sampleRate * duration;
let buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
let data = buffer.getChannelData(0);

// Create harsh noise
for (let i = 0; i < bufferSize; i++) {
data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
}

let noise = audioContext.createBufferSource();
noise.buffer = buffer;

let gain = audioContext.createGain();
gain.gain.value = 1.2;

noise.connect(gain);
gain.connect(audioContext.destination);

noise.start();
}

function watchMovie(level){

if(level !== current + 1){
alert("Follow the order...");
return;
}

current++;

triggerJumpScare();
document.getElementById("fearFill").style.width = (current*10) + "%";
}

function triggerJumpScare(){

let scare = document.getElementById("jumpscare");

scare.style.display = "block";

playScream();

if(navigator.vibrate){
navigator.vibrate([400,150,400]);
}

setTimeout(()=>{
scare.style.display = "none";
},1500);
}

</script>

</body>
</html>
