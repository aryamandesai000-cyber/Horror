<!DOCTYPE html>
<html>
<head>
<title>Ultimate Horror Experience</title>
<style>
body{
    margin:0;
    background:black;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
    overflow:hidden;
}

/* Blood drip animation */
body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100px;
    background:linear-gradient(red, transparent);
    animation:drip 3s infinite alternate;
    z-index:1;
}
@keyframes drip{
    from{height:60px;}
    to{height:120px;}
}

h1{
    margin-top:40px;
    font-size:40px;
    letter-spacing:4px;
    z-index:2;
    position:relative;
}

.movie{
    padding:15px;
    margin:15px auto;
    width:60%;
    background:#111;
    border:2px solid red;
    cursor:pointer;
    transition:0.3s;
    position:relative;
    z-index:2;
}
.movie:hover{
    background:red;
    transform:scale(1.05);
}

#fearBar{
    width:80%;
    height:20px;
    border:1px solid red;
    margin:20px auto;
    z-index:2;
    position:relative;
}
#fearFill{
    height:100%;
    width:0%;
    background:red;
    transition:0.5s;
}

/* Glitch effect */
.glitch{
    animation:glitch 0.2s infinite;
}
@keyframes glitch{
    0%{transform:translate(5px,-5px);}
    25%{transform:translate(-5px,5px);}
    50%{transform:translate(5px,5px);}
    75%{transform:translate(-5px,-5px);}
    100%{transform:translate(0);}
}

#overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:black;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-size:50px;
    z-index:1000;
}

#jumpscare{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:none;
    z-index:2000;
}
#jumpscare img{
    width:100%;
    height:100%;
    object-fit:cover;
}

#celebration{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:black;
    color:red;
    font-size:60px;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:3000;
}

button{
    padding:15px 25px;
    margin-top:20px;
    background:red;
    border:none;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>HORROR SURVIVAL</h1>
<p>Click in order. Survive all 10.</p>

<div id="fearBar"><div id="fearFill"></div></div>

<div id="movies">
<div class="movie" onclick="watchMovie(1)">1. Coraline</div>
<div class="movie" onclick="watchMovie(2)">2. A Quiet Place</div>
<div class="movie" onclick="watchMovie(3)">3. The Conjuring</div>
<div class="movie" onclick="watchMovie(4)">4. Hereditary</div>
<div class="movie" onclick="watchMovie(5)">5. The Exorcist</div>
<div class="movie" onclick="watchMovie(6)">6. The Ring</div>
<div class="movie" onclick="watchMovie(7)">7. Texas Chainsaw Massacre</div>
<div class="movie" onclick="watchMovie(8)">8. The Exorcism of Emily Rose</div>
<div class="movie" onclick="watchMovie(9)">9. Sinister</div>
<div class="movie" onclick="watchMovie(10)">10. Terrifier</div>
</div>

<div id="overlay"></div>
<div id="jumpscare"><img id="scareImg"></div>
<div id="celebration">
YOU SURVIVED THE NIGHT
<button onclick="location.reload()">Play Again</button>
</div>

<audio id="scream" src="https://www.soundjay.com/human/sounds/scream-01.mp3"></audio>
<audio autoplay loop>
<source src="https://www.soundjay.com/ambient/sounds/horror-ambient-01.mp3">
</audio>

<script>

let current=0;

const scareImages=[
"https://i.imgur.com/8QZ7Z0B.jpg",
"https://i.imgur.com/Z8q7ZQW.jpg",
"https://i.imgur.com/o7X9pKX.jpg"
];

function watchMovie(level){
if(level!==current+1){alert("Follow the order...");return;}
current++;

let overlay=document.getElementById("overlay");
overlay.style.display="flex";

let countdown=Math.floor(Math.random()*4)+2; // 2-5 sec

overlay.innerHTML="Watching...<br><br>"+countdown;

let interval=setInterval(()=>{
countdown--;
overlay.innerHTML="Watching...<br><br>"+countdown;

if(countdown<=0){
clearInterval(interval);
overlay.style.display="none";
glitchBeforeScare();
}
},1000);
}

function glitchBeforeScare(){
document.body.classList.add("glitch");

setTimeout(()=>{
document.body.classList.remove("glitch");
triggerJumpScare();
},400);
}

function triggerJumpScare(){

let scare=document.getElementById("jumpscare");
let img=document.getElementById("scareImg");
let sound=document.getElementById("scream");

img.src=scareImages[Math.floor(Math.random()*scareImages.length)];

scare.style.display="block";
sound.currentTime=0;
sound.play();

if(navigator.vibrate){
navigator.vibrate([200,100,200]);
}

document.getElementById("fearFill").style.width=(current*10)+"%";

setTimeout(()=>{
scare.style.display="none";
if(current===10){
ultimateEnd();
}
},1500);
}

function ultimateEnd(){
document.getElementById("celebration").style.display="flex";
}

</script>

</body>
</html>
